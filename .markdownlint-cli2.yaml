globs:
    - '**/*.md'
config:
    MD007:
        indent: 4
    MD013: false
    MD060: false
ignores:
    - '.artifacts'
    - '.artifacts/**'
    - '.cache'
    - '.cache/**'
    - '.venv'
    - '.venv/**'
    - '.venv-quant'
    - '.venv-quant/**'
    - 'htmlcov'
    - 'htmlcov/**'
    - 'node_modules'
    - 'node_modules/**'
    - 'rules/DOCUMENTATION.md'
