message: "Write titles and headings in sentence case: '%s'."
scope:
  - heading
  - text.frontmatter.title
match: $sentence
extends: capitalization
level: error
exceptions:
  - API
  - ASCII
  - ASD
  - BSD
  - Bash
  - Bun
  - CI
  - CLI
  - CPU
  - CRLF
  - CSRF
  - CSS
  - CSV
  - DOM
  - DTO
  - Docker
  - ESM
  - EUR
  - GBP
  - GNU
  - HTML
  - HTTP
  - HTTPS
  - ID
  - INI
  - JSON
  - JSX
  - Linux
  - MIME
  - MIT
  - Markdown
  - Node
  - POSIX
  - Prettier
  - Python
  - README
  - RPC
  - Ruff
  - SCSS
  - SDK
  - SHA
  - SQL
  - SSH
  - SVG
  - Semgrep
  - ShellCheck
  - TLS
  - TODO
  - TOML
  - TSX
  - Trivy
  - UI
  - URL
  - USD
  - UTC
  - UTF
  - Vale
  - WASM
  - Windows
  - XML
  - YAML
  - ajv
  - basedpyright
  - certifi
  - commitlint
  - deptry
  - docker
  - dotenv\-linter
  - editorconfig\-checker
  - gitleaks
  - gspot
  - hadolint
  - jscpd
  - lychee
  - macOS
  - markdownlint\-cli2
  - mise
  - node
  - npm
  - osv\-scanner
  - pnpm
  - prettier
  - pydoclint
  - pytest
  - pytest\-cov
  - ruff
  - semgrep
  - shellcheck
  - shfmt
  - syncpack
  - taplo
  - trivy
  - typos
  - uv
  - v8r
  - vale
  - vulture
  - xmllint
  - zsh
  - "[\\w-]+(?:\\.[\\w-]+)*\\.[A-Za-z]\\w*"
