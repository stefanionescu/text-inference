# Change these settings with `gspot set`, `unset`, or `unignore`, and the configurations with `gspot add` or `remove`.
# Write the [[scope]], [[command_check]], [[import_rule]], [[format.override]], [[naming.exception]], [[coverage.swift_target]], [[licenses.allowed_package]], [[tools.eslint.override]], and [[data_files.schemas]] records by hand.
level = "all"
configurations = ["bash", "docker", "fastapi", "markdown", "pytest", "python"]

[format]
indent_width = 2
print_width = 80
quotes = "double"
override = [{ paths = ["**/*.py"], indent_width = 4, print_width = 120 }]

[spelling]
allowed_words = { NVIDIA = "Real product and company names that the prose rules cannot spell out or lowercase.", TensorRT = "Real product and company names that the prose rules cannot spell out or lowercase.", LLM = "Real product and company names that the prose rules cannot spell out or lowercase.", vLLM = "Real product and company names that the prose rules cannot spell out or lowercase.", WebSocket = "Real product and company names that the prose rules cannot spell out or lowercase.", GPU = "Real product and company names that the prose rules cannot spell out or lowercase.", Hugging = "Real product and company names that the prose rules cannot spell out or lowercase.", Face = "Real product and company names that the prose rules cannot spell out or lowercase." }

