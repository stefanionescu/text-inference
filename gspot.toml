# Change these settings with `gspot set`, `unset`, or `unignore`, and the configurations with `gspot add` or `remove`.
# Write the [[scope]], [[command_check]], [[import_rule]], [[format.override]], [[naming.exception]], [[coverage.swift_target]], [[licenses.allowed_package]], [[tools.eslint.override]], and [[data_files.schemas]] records by hand.
level = "all"
configurations = ["bash", "docker", "fastapi", "markdown", "pytest", "python"]

[format]
indent_width = 2
print_width = 80
quotes = "double"
override = [{ paths = ["**/*.py"], indent_width = 4, print_width = 120 }]

[[import_rule]]
name = "config-limits"
paths = ["config/limits.py"]
can_import = []

[[import_rule]]
name = "config-security"
paths = ["config/security.py"]
can_import = []

[[import_rule]]
name = "config-text"
paths = ["config/text/**"]
can_import = []

[[import_rule]]
name = "config-model"
paths = ["config/model/**"]
can_import = []

[[import_rule]]
name = "config-runtime"
paths = ["config/runtime/**"]
can_import = []

[[import_rule]]
name = "config-prompt"
paths = ["config/prompt/**"]
can_import = []

[[import_rule]]
name = "config-tests"
paths = ["config/tests/**"]
can_import = []

[[import_rule]]
name = "config-package"
paths = ["config/__init__.py"]
can_import = []

[[import_rule]]
name = "errors"
paths = ["src/errors.py"]
can_import = []

[[import_rule]]
name = "tokens"
paths = ["src/tokens/**"]
can_import = []

[[import_rule]]
name = "text"
paths = ["src/text/**"]
can_import = ["config-text"]

[[import_rule]]
name = "logs"
paths = ["src/logs/**"]
can_import = ["config-runtime"]

[[import_rule]]
name = "runtime-records"
paths = ["src/runtime/__init__.py", "src/runtime/config.py", "src/runtime/environment.py", "src/runtime/limits.py", "src/runtime/settings.py", "src/runtime/validation.py"]
can_import = ["config-limits", "config-security", "config-model", "config-runtime", "config-prompt", "tokens"]

[[import_rule]]
name = "telemetry"
paths = ["src/telemetry/**"]
can_import = ["config-runtime", "errors", "logs", "runtime-records"]

[[import_rule]]
name = "quantization-trt"
paths = ["src/quantization/trt.py"]
can_import = ["config-model", "quantization-core"]

[[import_rule]]
name = "quantization-vllm"
paths = ["src/quantization/vllm/**"]
can_import = ["config-model", "quantization-core"]

[[import_rule]]
name = "quantization-core"
paths = ["src/quantization/**"]
can_import = ["config-model", "tokens"]

[[import_rule]]
name = "hf-trt"
paths = ["src/hf/trt.py"]
can_import = ["config-model", "quantization-core", "hf-core"]

[[import_rule]]
name = "hf-vllm"
paths = ["src/hf/vllm.py"]
can_import = ["config-model", "quantization-core", "hf-core"]

[[import_rule]]
name = "hf-core"
paths = ["src/hf/**"]
can_import = ["config-model"]

[[import_rule]]
name = "scripts"
paths = ["src/scripts/**"]
can_import = ["config-model", "config-prompt"]

[[import_rule]]
name = "engine-trt"
paths = ["src/engines/trt/**"]
can_import = ["tokens", "runtime-records", "engine-protocol"]

[[import_rule]]
name = "engine-vllm"
paths = ["src/engines/vllm/**"]
can_import = ["config-runtime", "tokens", "runtime-records", "quantization-vllm", "engine-protocol"]

[[import_rule]]
name = "engine-protocol"
paths = ["src/engines/**"]
can_import = []

[[import_rule]]
name = "session-runtime"
paths = ["src/session/runtime.py"]
can_import = ["tokens", "runtime-records", "session-state", "execution-pipeline"]

[[import_rule]]
name = "session-state"
paths = ["src/session/**"]
can_import = ["config-runtime", "tokens", "runtime-records", "engine-protocol"]

[[import_rule]]
name = "execution-turn"
paths = ["src/execution/turn.py"]
can_import = ["config-runtime", "telemetry", "session-runtime", "session-state", "execution-pipeline", "runtime-composition", "websocket-transport"]

[[import_rule]]
name = "execution-pipeline"
paths = ["src/execution/**"]
can_import = ["config-runtime", "config-prompt", "errors", "tokens", "text", "runtime-records", "telemetry", "engine-protocol", "session-state"]

[[import_rule]]
name = "runtime-composition"
paths = ["src/runtime/**"]
can_import = ["tokens", "runtime-records", "telemetry", "engine-vllm", "engine-protocol", "session-runtime"]

[[import_rule]]
name = "websocket-endpoint"
paths = ["src/websocket/endpoint.py", "src/websocket/receiver.py"]
can_import = ["config-runtime", "logs", "telemetry", "session-state", "runtime-composition", "websocket-transport", "messages"]

[[import_rule]]
name = "websocket-transport"
paths = ["src/websocket/**"]
can_import = ["config-runtime", "errors", "runtime-records", "telemetry", "session-state"]

[[import_rule]]
name = "messages"
paths = ["src/messages/**"]
can_import = ["config-limits", "config-runtime", "config-prompt", "errors", "text", "runtime-records", "telemetry", "session-runtime", "session-state", "execution-turn", "runtime-composition", "websocket-transport"]

[[import_rule]]
name = "server-trt"
paths = ["src/server/trt.py"]
can_import = ["config-model", "runtime-records", "telemetry", "engine-trt", "server-core"]

[[import_rule]]
name = "server-vllm"
paths = ["src/server/vllm.py"]
can_import = ["config-model", "runtime-records", "telemetry", "engine-vllm", "server-core"]

[[import_rule]]
name = "server-core"
paths = ["src/server/**"]
can_import = ["config-runtime", "logs", "runtime-records", "telemetry", "runtime-composition", "websocket-endpoint", "websocket-transport"]

[[import_rule]]
name = "package-root"
paths = ["src/__init__.py"]
can_import = ["logs"]

[[import_rule]]
name = "docker"
paths = ["docker/**"]
can_import = []

[[import_rule]]
name = "tests-errors"
paths = ["tests/harness/client/errors/**"]
can_import = ["config-tests"]

[[import_rule]]
name = "tests-state"
paths = ["tests/state/**"]
can_import = ["tests-errors"]

[[import_rule]]
name = "tests-harness"
paths = ["tests/harness/**"]
can_import = ["config-runtime", "config-prompt", "config-tests", "tokens", "runtime-records", "session-state", "tests-errors", "tests-state"]

[[import_rule]]
name = "tests-suites"
paths = ["tests/suites/**"]
can_import = ["config-model", "config-runtime", "config-tests", "errors", "tokens", "text", "logs", "runtime-records", "telemetry", "quantization-trt", "quantization-vllm", "quantization-core", "hf-trt", "hf-vllm", "hf-core", "scripts", "engine-trt", "engine-vllm", "engine-protocol", "session-runtime", "session-state", "execution-turn", "execution-pipeline", "runtime-composition", "websocket-endpoint", "websocket-transport", "messages", "server-core", "tests-errors", "tests-state", "tests-harness"]

[[import_rule]]
name = "tests-package"
paths = ["tests/**"]
can_import = []

[[ignore]]
check = "bash/shellcheck"
rule = "SC2310"
reason = "Scripts call functions in if and || conditions on purpose and handle each failure explicitly; the previous shellcheckrc turned this off too."

[[ignore]]
check = "bash/safety"
rule = "recursive-remove"
paths = ["scripts/lib/runtime/cleanup/{host,paths}.sh"]
reason = "The reset and cleanup commands delete caches on purpose, and each path is checked against its owner root first."

[[ignore]]
check = "bash/safety"
rule = "broad-kill"
paths = ["scripts/lib/runtime/cleanup/reset.sh"]
reason = "The host reset stops helper processes by pattern because it runs after their PID records may be gone."

[[ignore]]
check = "python/pip-installs"
paths = ["docker/vllm/Dockerfile"]
reason = "flashinfer ships from its own wheel index for each CUDA and Torch pair, so it cannot live in the shared lockfile."

[[ignore]]
check = "python/pip-installs"
paths = ["scripts/lib/deps/uv/environment.sh"]
reason = "This helper installs flashinfer from its own wheel index for each CUDA and Torch pair, so it cannot live in the shared lockfile."

[[ignore]]
check = "prose/vale"
paths = ["src/hf/templates/**"]
reason = "These are string.Template model cards; the ${...} fields and published wording render into Hugging Face model pages."

[[ignore]]
check = "markdown/fences"
paths = ["src/hf/templates/**"]
reason = "The JSON fences hold a ${quantization_summary} field that becomes valid JSON only when the template renders."

[[ignore]]
check = "docs/required-files"
rule = "missing-license"
reason = "The repository owner has not chosen a license yet, and agents should not choose one for them."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["tests/suites/**"]
reason = "pytest discovers test modules by the test_ prefix, so the prefix must stay."

[[ignore]]
check = "python/vulture"
paths = ["src/server/listeners.py"]
reason = "uvicorn calls these Server overrides and reads should_exit by name."

[[ignore]]
check = "python/vulture"
paths = ["src/websocket/schemas.py"]
reason = "Pydantic calls the field validators by decorator, not by name."

[[ignore]]
check = "python/vulture"
paths = ["tests/harness/logic/live/client.py"]
reason = "The _close_task attribute keeps a strong reference so the close task is not garbage collected."

[[ignore]]
check = "python/vulture"
paths = ["tests/suites/unit/session/test_request_tracking.py"]
reason = "The test sets return_value on a Mock, which vulture reads as an unused attribute."

[[ignore]]
check = "secrets/environment-examples"
paths = ["tests/suites/unit/dependency_logging/test_dependency_output.py"]
reason = "The test asserts a variable the code sets for a dependency; nobody configures it."
